name: ci
on:
  push:
  pull_request:
jobs:
  lint-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy
      - run: pytest tests/unit -q
      - name: Config diff (generated files must match the inventory)
        run: |
          fabricx generate
          git diff --exit-code -- generated docs/topology.md || (echo "generated files are out of date: run 'fabricx generate' and commit" && exit 1)
      - name: Traceability (specs must point at real tests)
        run: fabricx trace

  lab:
    needs: lint-unit
    timeout-minutes: 20
    runs-on: ubuntu-latest   # x86_64, 4 vCPU / 16 GB
    env:
      FABRICX_EXEC: sudo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # Exactly the README's commands, on a brand-new machine every run (= the clean-room check).
      - run: make vm-setup RUN=sudo
      - run: make setup RUN=sudo PY=python
      - run: make up RUN=sudo
      - name: make test (lint, types, unit + lab tests, validate, drift, traceability)
        run: make test
      - name: L3VNI check-and-repair log (did the start-up workaround fire?)
        if: always()
        run: for n in leaf1 leaf2 leaf3; do sudo docker exec clab-fabricx-$n cat /var/log/fabricx-heal.log 2>/dev/null; done | tee artifacts/heal.log
      - name: Diagnostics on failure
        if: failure()
        run: |
          .venv/bin/fabricx validate || true
          sudo docker ps -a --format '{{.Names}} {{.Status}}' || true
          for n in leaf1 leaf2 leaf3 spine1 spine2; do echo "== $n"; sudo docker exec clab-fabricx-$n vtysh -c 'show bgp summary' -c 'show bfd peers brief' || true; done
          for n in leaf1 leaf3; do echo "== VRF/EVPN $n"; sudo docker exec clab-fabricx-$n vtysh -c 'show vrf' -c 'show evpn vni' -c 'show bgp vrf all ipv4 unicast' -c 'show bgp l2vpn evpn route type prefix' || true; sudo docker exec clab-fabricx-$n ip -br link; sudo docker exec clab-fabricx-$n sh -c 'ps -eo pid,lstart,cmd | grep -E "bgpd|zebra" | head -4'; done
          sudo docker exec clab-fabricx-leaf1 vtysh -c 'show running-config' | sed -n '/^vrf RED/,/^exit-vrf/p;/router bgp 65001 vrf RED/,/^exit/p' || true
          uptime; free -m
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: |
            artifacts/junit.xml
            artifacts/heal.log
            artifacts/validate/
      - name: Tear down
        if: always()
        run: make RUN=sudo fabric-down

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fabricx-host:1 images/host
      - name: Scan lab images (report HIGH/CRITICAL)
        run: |
          docker pull quay.io/frrouting/frr:10.2.1
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --severity HIGH,CRITICAL --exit-code 0 fabricx-host:1
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --severity HIGH,CRITICAL --exit-code 0 quay.io/frrouting/frr:10.2.1
