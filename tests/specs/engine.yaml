- id: REQ-ENGINE-001
  title: Generation is deterministic and inventory-only
  requirement: Configs are generated from the inventory; the same inventory gives byte-identical output; no IP literal exists in code or templates.
  steps: ["render twice and compare", "scan src/ and templates/ for IP literals"]
  pass: outputs equal; zero literals
  tests:
    - tests/unit/test_model.py::test_generation_is_deterministic_and_complete
    - tests/unit/test_no_hardcoding.py::test_no_ip_literals_in_code_or_templates
  evidence: [generated/]
- id: REQ-ENGINE-002
  title: Inventory validation
  requirement: Bad inventories (host outside subnet, duplicate ASN) are rejected before anything is generated.
  steps: ["load mutated inventories"]
  pass: ValidationError raised
  tests:
    - tests/unit/test_model.py::test_host_outside_subnet_rejected
    - tests/unit/test_model.py::test_duplicate_leaf_asn_rejected
  evidence: [src/fabricx/model.py]
- id: REQ-ENGINE-003
  title: Validation engine finds real state matching intent
  requirement: "`fabricx validate` reports nothing on a healthy fabric and the right finding for each seeded fault."
  steps: ["snapshot live state and validate", "unit tests mutate a good state one fault at a time"]
  pass: zero findings when healthy; expected check id when broken
  tests:
    - tests/lab/test_engine_validate.py::test_engine_finds_nothing_on_healthy_fabric
    - tests/unit/test_parsers_validators.py::test_good_state_has_no_findings
  evidence: [artifacts/validate/]
- id: REQ-ENGINE-004
  title: Drift detection
  requirement: A manual vtysh change that differs from the inventory is detected and reported per node.
  steps: ["change a BGP timer by hand on leaf2", "run `fabricx drift`"]
  pass: exit 1 naming leaf2 and both the missing and the extra line; exit 0 after reverting
  tests:
    - tests/lab/test_engine_hardening.py::test_drift_clean_then_detects_manual_vtysh_change_then_clean_again
    - tests/unit/test_drift.py::test_changed_timer_detected_both_ways
  evidence: [docs/phases/phase-5-hardening-and-ci.md]
- id: REQ-ENGINE-005
  title: Unreachable node handling
  requirement: A stopped, paused or hung node is reported as `node-unreachable` and does not crash or hang the run.
  steps: ["pause leaf3", "snapshot and validate"]
  pass: finding node-unreachable for leaf3; other nodes still checked
  tests:
    - tests/lab/test_engine_hardening.py::test_paused_node_is_reported_unreachable_not_a_crash
    - tests/unit/test_runner.py::test_timeout_becomes_node_unreachable
  evidence: [src/fabricx/runner.py]
- id: REQ-MEASURE-001
  title: Probe accuracy
  requirement: The loss-window probe counts loss, longest gap and reordering correctly and has a documented resolution.
  steps: ["synthetic gaps", "clean 4 s run on the lab"]
  pass: exact numbers on synthetic data; zero loss on a healthy fabric
  tests:
    - tests/unit/test_probe.py::test_synthetic_outage_is_measured
    - tests/lab/test_phase2_underlay.py::test_probe_across_fabric_no_loss_and_documented_resolution
  evidence: [experiments/E1/method.md]
